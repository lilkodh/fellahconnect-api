paths:

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
                - role
              properties:
                fullName:
                  type: string
                  example: Ahmed Benali

                email:
                  type: string
                  format: email
                  example: ahmed@example.com

                password:
                  type: string
                  format: password
                  example: password123

                role:
                  type: string
                  enum:
                    - admin
                    - farmer
                  example: farmer

      responses:
        "201":
          description: User registered successfully

        "400":
          description: Invalid request

  /auth/login:
    post:
      tags:
        - Authentication

      summary: Login

      description: Authenticates a user and returns a JWT.

      requestBody:
        required: true

        content:
          application/json:

            schema:
              type: object

              required:
                - email
                - password

              properties:

                email:
                  type: string
                  format: email
                  example: ahmed@example.com

                password:
                  type: string
                  format: password
                  example: password123

      responses:

        "200":
          description: Login successful

        "401":
          description: Invalid credentials